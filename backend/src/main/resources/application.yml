server:
  port: 8080
  compression:
    enabled: true
  error:
    include-message: always

spring:
  application:
    name: research-gateway
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/research_gateway}
    username: ${DB_USER:research}
    password: ${DB_PASSWORD:research}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
